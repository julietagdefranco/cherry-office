# Tests del backend TypeScript en Windows y Linux (en macOS se corren a mano, también contra el backend Swift).
#
# Corre la suite de paridad contra el backend TS con el `claude` falso (backend/test/fixtures/claude-fake.cjs):
# no usa el claude real ni ninguna cuenta.
# - Windows: el mensaje viaja por la entrada estándar (el runner lo hace siempre ahí).
# - Linux: dos pasadas en paralelo (jobs separados), con el mensaje como argumento (igual que en Mac) y por la
#   entrada estándar.
# Las dependencias salen de la caché de npm (setup-node); casi todo el tiempo es la suite.
name: Backend

on:
  push:
    paths: ["backend/**", "oficina/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "oficina/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.nombre }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nombre: windows, os: windows-latest, stdin: "" }
          - { nombre: linux, os: ubuntu-latest, stdin: "" }
          - { nombre: linux (stdin), os: ubuntu-latest, stdin: "1" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      HQ_BACKEND: ts
      HQ_MENSAJE_STDIN: ${{ matrix.stdin }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Dependencias
        run: npm ci

      - name: Tipos
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run
