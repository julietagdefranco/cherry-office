# Build automático de los instaladores.
#
# - Al subir una etiqueta vX.Y.Z: corre los tests, arma el .dmg (Mac) y el instalador .exe (Windows) y los adjunta
#   a la release de esa etiqueta.
#   Si la release ya existe (notas escritas a mano), solo sube o reemplaza el instalador, sin tocar las notas.
#   Si no existe, la crea como borrador para completar las notas antes de publicarla.
# - A mano (Actions → Release → Run workflow): arma los instaladores y los deja como artefactos del run, sin release.
#
# Las dos plataformas salen de la carcasa Electron (desktop/) con el backend TypeScript (backend/).
# La versión sale de desktop/package.json.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  instalador:
    name: ${{ matrix.nombre }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nombre: macOS (arm64), os: macos-latest, builder: --mac --arm64, archivo: "Oficina-{v}-arm64.dmg", tests: true }
          - { nombre: Windows (x64), os: windows-latest, builder: --win --x64, archivo: "Oficina-Setup-{v}.exe", tests: false }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      # descargas de Electron y de las herramientas de electron-builder (NSIS, 7zip): van a la caché
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v4

      - name: Versión
        id: version
        run: |
          VERSION="$(node -p "require('./desktop/package.json').version")"
          [ -n "$VERSION" ] || { echo "::error::No pude leer la versión de desktop/package.json."; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con la versión de desktop/package.json ($VERSION)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            desktop/package-lock.json

      - name: Caché de Electron
        uses: actions/cache@v4
        with:
          path: .cache
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Dependencias
        run: |
          npm ci --prefix backend
          npm ci --prefix desktop

      - name: Tipos
        run: |
          (cd backend && npx tsc --noEmit)
          (cd desktop && npx tsc -p .)

      # En Windows y Linux los corre backend.yml en cada cambio; acá, en Mac, antes de publicar.
      - name: Tests del backend
        if: matrix.tests
        working-directory: backend
        run: npx vitest run

      - name: Compilar y empaquetar
        working-directory: desktop
        run: |
          node scripts/build.mjs --recursos
          npx electron-builder ${{ matrix.builder }} --publish never

      - name: Instalador
        id: inst
        run: |
          NAME="$(echo '${{ matrix.archivo }}' | sed "s/{v}/${{ steps.version.outputs.version }}/")"
          [ -f "desktop/release/$NAME" ] || { echo "::error::No se generó desktop/release/$NAME"; exit 1; }
          SHA="$(node -e "const c=require('crypto'),f=require('fs');console.log(c.createHash('sha256').update(f.readFileSync(process.argv[1])).digest('hex'))" "desktop/release/$NAME")"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          { echo "### $NAME"; echo; echo "SHA-256: \`$SHA\`"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.inst.outputs.name }}
          path: desktop/release/${{ steps.inst.outputs.name }}
          retention-days: 14

      - name: Adjuntar a la release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          FILE: desktop/release/${{ steps.inst.outputs.name }}
        run: |
          # los dos instaladores se arman en paralelo: si el otro ya creó la release, solo se sube el archivo
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "Oficina $VERSION" \
              --notes "Borrador generado por el build automático. Completar las notas antes de publicar." || true
          fi
          gh release upload "$TAG" "$FILE" --clobber
