# App de escritorio (Electron): en cada cambio arma el instalador de Windows y el .dmg de Mac y los deja como
# artefactos del run, para probarlos antes de sacar una release (la release la arma release.yml con la etiqueta).
name: Desktop

on:
  push:
    paths: ["desktop/**", "backend/src/**", "backend/package*.json", "oficina/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "backend/src/**", "backend/package*.json", "oficina/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instalador:
    name: instalador de ${{ matrix.nombre }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nombre: Windows, os: windows-latest, builder: --win --x64, patron: "Oficina-Setup-*.exe", artefacto: Oficina-Setup-windows }
          - { nombre: Mac, os: macos-latest, builder: --mac --arm64, patron: "Oficina-*-arm64.dmg", artefacto: Oficina-mac }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            desktop/package-lock.json

      - name: Caché de Electron
        uses: actions/cache@v4
        with:
          path: .cache
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Dependencias
        run: |
          npm ci --prefix backend
          npm ci --prefix desktop

      - name: Tipos
        working-directory: desktop
        run: npx tsc -p .

      - name: Compilar y empaquetar
        working-directory: desktop
        run: |
          node scripts/build.mjs --recursos
          npx electron-builder ${{ matrix.builder }} --publish never

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefacto }}
          path: desktop/release/${{ matrix.patron }}
          retention-days: 7
