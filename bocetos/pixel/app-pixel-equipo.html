<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Equipo como chat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* La app tal como está en main (riel · lista · vista, tokens de oficina/ui/estilo.css). Solo la oficina, los retratos y el editor de apariencia son pixel. */
:root{
  --fondo:#f2f0ec;--panel:#ffffff;--panel-2:#f8f7f4;--linea:#e4e1db;--linea-fuerte:#d3cfc7;
  --texto:#1d1d1f;--suave:#6d6962;--tenue:#9a958d;--acento:#1d1d1f;--sobre-acento:#ffffff;
  --peligro:#b3362c;--ok:#3b7a4b;--aviso:#a46a12;--foco:rgba(29,29,31,.10);
  --sombra:0 1px 2px rgba(20,18,15,.06),0 8px 24px rgba(20,18,15,.08);
  --sombra-alta:0 2px 6px rgba(20,18,15,.08),0 24px 60px rgba(20,18,15,.18);
  --radio:10px;--radio-chico:7px;--riel:68px;--lista:284px;--ancho-lectura:760px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --fondo:#19191b;--panel:#232326;--panel-2:#1e1e21;--linea:#333337;--linea-fuerte:#45454a;
  --texto:#f1f1f2;--suave:#a3a3a8;--tenue:#75757b;--acento:#f1f1f2;--sobre-acento:#1b1b1d;
  --peligro:#e0675d;--ok:#6cbf80;--aviso:#e0a84a;--foco:rgba(255,255,255,.2);
  --sombra:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);--sombra-alta:0 2px 6px rgba(0,0,0,.35),0 24px 60px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --fondo:#19191b;--panel:#232326;--panel-2:#1e1e21;--linea:#333337;--linea-fuerte:#45454a;
  --texto:#f1f1f2;--suave:#a3a3a8;--tenue:#75757b;--acento:#f1f1f2;--sobre-acento:#1b1b1d;
  --peligro:#e0675d;--ok:#6cbf80;--aviso:#e0a84a;--foco:rgba(255,255,255,.2);
  --sombra:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);--sombra-alta:0 2px 6px rgba(0,0,0,.35),0 24px 60px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--fondo);color:var(--texto);font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
p{margin:0}
svg{flex:none}
button:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 13px;border-radius:var(--radio-chico);border:1px solid var(--linea-fuerte);background:var(--panel);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.pri{background:var(--acento);border-color:var(--acento);color:var(--sobre-acento)}
.btn.pri:hover{opacity:.88}
.btn.chico{height:26px;padding:0 9px;font-size:12px}
.btn.peligro{color:var(--peligro)}
.btn svg{width:15px;height:15px}
.campo{width:100%;height:34px;padding:0 10px;border-radius:var(--radio-chico);border:1px solid var(--linea-fuerte);background:var(--panel);outline:none}
textarea.campo{height:auto;min-height:64px;padding:8px 10px;resize:vertical}
.campo:focus{border-color:var(--suave);box-shadow:0 0 0 2px var(--foco)}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;border:1px solid var(--linea-fuerte);background:var(--panel);font-size:12px;cursor:pointer}
.chip.sel,.chip[aria-pressed="true"]{background:var(--acento);color:var(--sobre-acento);border-color:var(--acento)}
.chip .punto{width:8px;height:8px;border-radius:2px}
.insignia{display:inline-flex;align-items:center;gap:5px;height:18px;padding:0 7px;border-radius:9px;border:1px solid var(--linea);background:var(--panel-2);font-size:11px;color:var(--suave);white-space:nowrap}
.insignia .punto{width:7px;height:7px;border-radius:2px}
.oculto-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ---------- estructura ---------- */
.app{height:100%;display:grid;grid-template-columns:var(--riel) var(--lista) minmax(0,1fr);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.app.en-oficina{grid-template-columns:var(--riel) 0 minmax(0,1fr)}
.app.en-oficina .lista-col{display:none}
.riel{grid-column:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;background:var(--panel-2);border-right:1px solid var(--linea);min-height:0;overflow-y:auto;scrollbar-width:none}
.riel-logo{border:0;background:none;padding:4px;border-radius:10px;cursor:pointer;margin-bottom:4px}
.riel-logo:hover{background:var(--panel)}
.logo{width:30px;height:30px;border-radius:8px;background:var(--acento);color:var(--sobre-acento);display:grid;place-items:center}
.logo svg{width:17px;height:17px}
.riel-nuevo{width:40px;height:40px;border-radius:12px;border:1px solid var(--linea-fuerte);background:var(--panel);cursor:pointer;display:flex;align-items:center;justify-content:center;margin:2px 0 8px;flex:none}
.riel-nuevo:hover{background:var(--fondo)}
.riel-nuevo svg{width:18px;height:18px}
.riel-item{position:relative;width:56px;min-height:50px;border:0;border-radius:12px;background:none;cursor:pointer;color:var(--suave);flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;padding:4px 2px}
.riel-item svg{width:19px;height:19px}
.riel-item:hover{background:var(--panel);color:var(--texto)}
.riel-item.activo{background:var(--panel);color:var(--texto);box-shadow:inset 0 0 0 1px var(--linea-fuerte)}
.riel-item .n{position:absolute;top:2px;right:2px;height:16px;min-width:16px;padding:0 4px;font-size:10px;border-radius:8px;border:1px solid var(--linea);background:var(--panel);color:var(--texto);display:flex;align-items:center;justify-content:center}
.riel-item .n.aviso{background:var(--aviso);border-color:var(--aviso);color:#1d1d1f}
.riel-sep{flex:1;min-height:8px}
.riel-uso{width:56px;padding:6px 2px;border:0;background:none;border-radius:12px;font-size:10px;color:var(--suave);display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.25;cursor:pointer;font-variant-numeric:tabular-nums}
.riel-uso:hover{background:var(--panel)}
.riel-uso svg{width:15px;height:15px}
.riel-uso b{color:var(--texto);font-weight:600}
.lista-col{grid-column:2;display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--linea);background:var(--panel-2);overflow:hidden}
.lista-cab{display:flex;align-items:center;gap:8px;padding:16px 14px 8px}
.lista-cab h2{font-size:16px;flex:1}
.lista-buscar{margin:0 12px 6px;position:relative}
.lista-buscar>svg{position:absolute;left:9px;top:9px;width:15px;height:15px;color:var(--tenue)}
.lista-buscar .campo{padding-left:30px;height:32px}
.lista-cuerpo{flex:1;overflow-y:auto;padding:0 8px 14px;min-height:0}
.lista-grupo{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--tenue);text-transform:uppercase;letter-spacing:.04em;padding:14px 8px 5px}
.lista-grupo .punto{width:8px;height:8px;border-radius:2px}
.lista-grupo .cuenta{margin-left:auto;font-weight:500}
.lista-item{display:flex;gap:10px;align-items:center;width:100%;padding:7px 8px;border-radius:var(--radio-chico);cursor:pointer;border:0;background:none;text-align:left}
.lista-item:hover{background:var(--panel)}
.lista-item.activo{background:var(--panel);box-shadow:inset 0 0 0 1px var(--linea-fuerte)}
.lista-icono{width:32px;height:32px;border-radius:8px;background:var(--fondo);display:flex;align-items:center;justify-content:center;color:var(--suave);flex:none}
.lista-item.simple{padding:6px 8px}
.lista-item.simple .lista-icono{width:auto;height:auto;background:none}
.lista-item-txt{min-width:0;flex:1}
.lista-item-tit{display:flex;gap:6px;align-items:baseline}
.lista-item-tit b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.lista-item.simple b{font-weight:500}
.lista-item-tit small{color:var(--tenue);font-size:11px;flex:none}
.lista-item-sub{color:var(--suave);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lista-item .cnt{color:var(--tenue);font-size:12px}
.retrato{width:32px;height:32px;border-radius:8px;background:var(--fondo);image-rendering:pixelated;flex:none;display:block}
.vista{grid-column:3;position:relative;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column}
/* oficina */
#stage{position:absolute;inset:0;overflow:hidden}
#view{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.tilt{position:absolute;left:0;right:0;height:0;pointer-events:none;transition:height .45s}
.tilt.up{top:0;-webkit-mask-image:linear-gradient(#000 35%,transparent);mask-image:linear-gradient(#000 35%,transparent)}
.tilt.dn{bottom:0;-webkit-mask-image:linear-gradient(transparent,#000 65%);mask-image:linear-gradient(transparent,#000 65%)}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--linea);border-radius:var(--radio-chico);box-shadow:var(--sombra);padding:3px 9px;font-size:12px;white-space:nowrap;transform:translate(-50%,-130%);z-index:3}
.rotulo{position:absolute;top:14px;left:14px;z-index:5;display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--panel);border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra);max-width:40%}
.rotulo b{font-weight:650;font-size:14px;display:block}
.rotulo small{font-size:12px;color:var(--suave)}
.herr{position:absolute;top:14px;right:14px;display:flex;gap:8px;z-index:5}
.herr .btn{box-shadow:var(--sombra)}
.pista{position:absolute;left:14px;bottom:10px;color:var(--tenue);font-size:11.5px;z-index:4}
.zonas{position:absolute;left:14px;bottom:32px;display:flex;gap:6px;flex-wrap:wrap;z-index:4;right:14px;pointer-events:none}
.zonas .chip{pointer-events:auto;box-shadow:var(--sombra)}
.app.en-seccion #stage,.app.en-seccion .rotulo,.app.en-seccion .herr,.app.en-seccion .pista,.app.en-seccion .zonas{display:none}
.app.en-oficina .panel{display:none}
/* pantalla de sección */
.panel{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.der-cab{display:flex;align-items:center;gap:12px;padding:16px 16px 12px}
.der-ico{width:52px;height:52px;border-radius:12px;background:var(--fondo);border:1px solid var(--linea);display:flex;align-items:center;justify-content:center;color:var(--suave);flex:none}
.der-ico svg{width:22px;height:22px}
.der-cab h2{font-size:16px;line-height:1.25}
.der-cab small{color:var(--suave);font-size:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.der-acciones{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap}
.pestanas{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--linea);overflow-x:auto}
.pestana{background:none;border:0;padding:9px 8px;cursor:pointer;color:var(--suave);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500}
.pestana.activa{color:var(--texto);border-bottom-color:var(--texto)}
.der-cuerpo{flex:1;min-height:0;overflow-y:auto;padding:14px 16px}
.der-pie{border-top:1px solid var(--linea);padding:10px 16px 14px}
.lectura{width:100%;max-width:var(--ancho-lectura);margin-left:auto;margin-right:auto}
.der-cuerpo>.lectura{display:flex;flex-direction:column;gap:10px}
.acciones{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.acciones>.izq{margin-right:auto;display:flex;gap:8px}
.nav-vacio{margin:auto;text-align:center;color:var(--suave);padding:40px 24px;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:6px}
.nav-vacio>svg{width:34px;height:34px;color:var(--tenue);margin-bottom:6px}
.nav-vacio b{color:var(--texto);font-size:15px}
.nav-vacio .fila{margin-top:12px;justify-content:center}
.card{background:var(--panel);border:1px solid var(--linea);border-radius:var(--radio);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.card h3{font-size:13.5px}
.card p{color:var(--suave);font-size:12.5px}
.fila{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fila .sp{margin-left:auto}
.mini{width:22px;height:22px;border-radius:6px;background:var(--fondo);image-rendering:pixelated;flex:none}
.meta{color:var(--tenue);font-size:12px}
.sec-tit{font-size:11px;font-weight:600;color:var(--tenue);text-transform:uppercase;letter-spacing:.04em;margin-top:8px}
.fila-dec{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--linea)}
.fila-dec:first-child{border-top:0}
.fila-txt{flex:1;min-width:0}
.fila-tit{font-weight:500}
.fila-sub{color:var(--suave);font-size:12px}
.pasos{display:flex;gap:4px}
.pasos i{flex:1;height:6px;border-radius:3px;background:var(--linea)}
.pasos i.ok{background:var(--ok)}
.pasos i.va{background:var(--aviso);animation:latir 1.2s ease-in-out infinite}
@keyframes latir{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.pasos i.va{animation:none}}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;padding:8px 12px;border-radius:12px;background:var(--panel-2);border:1px solid var(--linea)}
.msg.yo{align-self:flex-end;background:var(--acento);color:var(--sobre-acento);border-color:var(--acento)}
.herram{align-self:flex-start;font-size:12px;color:var(--suave);border:1px solid var(--linea);background:var(--panel-2);border-radius:var(--radio-chico);padding:3px 9px;display:flex;gap:6px;align-items:center}
.herram svg{width:13px;height:13px}
.herram.err{color:var(--peligro)}
.sug{display:flex;flex-wrap:wrap;gap:6px}
.redactar{display:flex;gap:8px;align-items:flex-end}
.redactar textarea{flex:1;resize:none;background:var(--panel);border:1px solid var(--linea-fuerte);border-radius:var(--radio);padding:9px 11px;min-height:40px}
.redactar textarea:focus{outline:none;border-color:var(--suave);box-shadow:0 0 0 2px var(--foco)}
.ib{width:40px;height:40px;border-radius:var(--radio);display:grid;place-items:center;background:var(--panel);border:1px solid var(--linea-fuerte);cursor:pointer;color:var(--suave)}
.ib.pri{background:var(--acento);border-color:var(--acento);color:var(--sobre-acento)}
.ib svg{width:16px;height:16px}
.nota-ch{font-size:11.5px;color:var(--tenue);margin-top:6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.agente-cara{position:relative;border:0;padding:0;background:none;cursor:pointer;border-radius:10px;flex:none}
.agente-cara .retrato{width:40px;height:40px;border-radius:10px}
.agente-lapiz{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:var(--panel);border:1px solid var(--linea-fuerte);display:flex;align-items:center;justify-content:center;color:var(--suave);box-shadow:var(--sombra);opacity:0;transition:opacity .12s}
.agente-lapiz svg{width:12px;height:12px}
.agente-cara:hover .agente-lapiz{opacity:1}
/* perfil y apariencia */
.perfil-cara{display:flex;flex-direction:column;gap:8px;width:220px}
.perfil-prev{width:220px;height:200px;border:1px solid var(--linea);border-radius:var(--radio);background:var(--panel-2);display:grid;place-items:center}
.perfil-prev canvas{image-rendering:pixelated;width:192px;height:156px}
details.apariencia summary{cursor:pointer;color:var(--suave);font-size:12.5px;padding:4px 0}
.ap-grid{display:grid;gap:12px;padding:10px 0 4px}
.etq{font-size:12px;font-weight:500;color:var(--suave);margin-bottom:6px;display:block}
.etq-sub{font-size:12px;color:var(--tenue);margin:-4px 0 6px}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:24px;height:24px;border-radius:6px;border:1px solid rgba(0,0,0,.12);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--acento)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts .chip{text-transform:capitalize}
.form{display:grid;gap:12px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--linea)}
.toggle b{font-weight:550;display:block}
.toggle small{color:var(--suave);font-size:12px}
.sw-on{width:34px;height:20px;border-radius:10px;background:var(--linea-fuerte);border:0;position:relative;flex:none;cursor:pointer;padding:0}
.sw-on::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .12s}
.sw-on[aria-checked="true"]{background:var(--acento)}
.sw-on[aria-checked="true"]::after{left:16px;background:var(--sobre-acento)}
/* biblioteca */
.biblio-barra{display:flex;gap:8px;align-items:center;padding:0 16px 12px;flex-wrap:wrap}
.biblio-barra .campo{flex:1;min-width:160px;height:32px}
.biblio{flex:1;min-height:0;display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--linea)}
.biblio>div{overflow-y:auto;min-width:0}
.biblio .filtros{padding:8px;border-right:1px solid var(--linea);display:flex;flex-direction:column;gap:2px}
.biblio .filtros button{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:var(--radio-chico);border:0;background:none;cursor:pointer;text-align:left;color:var(--suave);font-size:12.5px}
.biblio .filtros button.sel{background:var(--panel-2);color:var(--texto);font-weight:600}
.biblio .filtros button span{margin-left:auto;color:var(--tenue)}
.biblio .filtros svg{width:14px;height:14px}
.biblio .docs{border-right:1px solid var(--linea);padding:6px}
.doc{display:flex;gap:10px;align-items:flex-start;width:100%;padding:8px;border:0;background:none;border-radius:var(--radio-chico);cursor:pointer;text-align:left}
.doc:hover,.doc.sel{background:var(--panel-2)}
.doc svg{width:18px;height:18px;margin-top:1px}
.doc b{font-weight:550;display:block;overflow-wrap:anywhere}
.biblio .det{padding:16px;color:var(--suave)}
/* menús, Ajustes y ⌘K */
.menu-pop{position:fixed;background:var(--panel);border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra-alta);padding:5px;min-width:230px;z-index:30}
.menu-pop button{display:flex;gap:10px;align-items:center;width:100%;height:32px;padding:0 10px;border-radius:var(--radio-chico);background:none;border:0;text-align:left;cursor:pointer}
.menu-pop button:hover{background:var(--panel-2)}
.menu-pop svg{width:16px;height:16px;color:var(--suave)}
.velo{position:fixed;inset:0;background:rgba(20,18,15,.35);display:grid;place-items:start center;padding:10vh 16px 16px;z-index:20}
.velo[hidden]{display:none!important}
.modal{width:min(720px,100%);background:var(--panel);border:1px solid var(--linea);border-radius:14px;box-shadow:var(--sombra-alta);display:flex;flex-direction:column;max-height:80vh;overflow:hidden}
.modal .der-cab .x{margin-left:auto}
.ajustes{display:grid;grid-template-columns:180px minmax(0,1fr);min-height:0;flex:1;border-top:1px solid var(--linea)}
.ajustes nav{border-right:1px solid var(--linea);padding:8px;display:flex;flex-direction:column;gap:2px;background:var(--panel-2)}
.ajustes nav button{background:none;border:0;text-align:left;height:32px;padding:0 10px;border-radius:var(--radio-chico);cursor:pointer;color:var(--suave)}
.ajustes nav button[aria-pressed="true"]{background:var(--panel);color:var(--texto);box-shadow:inset 0 0 0 1px var(--linea-fuerte)}
.ajustes .der-cuerpo{display:flex;flex-direction:column;gap:12px}
.temas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tema{border:1px solid var(--linea);border-radius:var(--radio);background:var(--panel);padding:10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px}
.tema.sel{border-color:var(--acento);box-shadow:inset 0 0 0 1px var(--acento)}
.tema .pv{height:70px;border-radius:var(--radio-chico);display:grid;place-items:center;font-weight:600;color:#fff;letter-spacing:.04em}
.tema span{color:var(--suave);font-size:12px}
.x{width:32px;height:32px;border-radius:var(--radio-chico);background:none;border:0;cursor:pointer;display:grid;place-items:center;color:var(--suave)}
.x:hover{background:var(--panel-2)}
.x svg{width:16px;height:16px}
.paleta{width:min(560px,100%);background:var(--panel);border:1px solid var(--linea);border-radius:14px;box-shadow:var(--sombra-alta);overflow:hidden}
.paleta input{width:100%;background:var(--panel);border:0;border-bottom:1px solid var(--linea);font-size:15px;padding:14px 16px}
.paleta input:focus{outline:none}
.res{max-height:50vh;overflow-y:auto;padding:6px}
.res .gr{font-size:11px;font-weight:600;color:var(--tenue);padding:8px 10px 4px;text-transform:uppercase;letter-spacing:.04em}
.res button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;padding:6px 10px;border-radius:var(--radio-chico);text-align:left;cursor:pointer}
.res button:hover,.res button.act{background:var(--panel-2)}
.res svg{width:16px;height:16px;color:var(--suave)}
.res small{margin-left:auto;color:var(--tenue)}
@media (max-width:1100px){.biblio{grid-template-columns:130px minmax(0,1fr)}.biblio .det{display:none}}
/* celular: el riel abajo; en una sección se ve la lista o lo elegido */
@media (max-width:720px){
  .app,.app.en-oficina{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .riel{grid-row:2;grid-column:1;flex-direction:row;justify-content:space-around;gap:0;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--linea);overflow-x:auto}
  .riel-logo,.riel-sep,.riel-uso,.riel-extra{display:none}
  .riel-nuevo{margin:0 4px;width:38px;height:38px}
  .riel-item{width:auto;min-width:54px;min-height:46px}
  .lista-col,.vista{grid-row:1;grid-column:1}
  .lista-col{border-right:0;padding-top:env(safe-area-inset-top,0px)}
  .app.en-seccion.con-detalle .lista-col{display:none}
  .app.en-seccion:not(.con-detalle) .vista{display:none}
  .rotulo{top:calc(12px + env(safe-area-inset-top,0px));left:12px;max-width:calc(100% - 160px)}
  .herr{top:calc(12px + env(safe-area-inset-top,0px));right:12px}
  .herr .btn-txt,.pista{display:none}
  .der-cab{flex-wrap:wrap}
  .biblio{grid-template-columns:minmax(0,1fr)}.biblio .filtros{display:none}
  .ajustes{grid-template-columns:minmax(0,1fr)}
  .ajustes nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--linea)}
}
/* ---------- boceto: tarjeta de estado y chat en panel lateral ---------- */
.pop{position:absolute;z-index:8;width:300px;background:var(--panel);border:1px solid var(--linea);border-radius:12px;box-shadow:var(--sombra-alta);display:flex;flex-direction:column;
  transform:translate(-50%,calc(-100% - 14px));transition:opacity .12s}
.pop[hidden]{display:none}
.pop-in{overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;border-radius:12px}
.pop-in::-webkit-scrollbar{width:0}
.pop.abajo{transform:translate(-50%,14px)}
.pop::after{content:"";position:absolute;left:var(--flecha,50%);bottom:-6px;width:10px;height:10px;background:var(--panel);border-right:1px solid var(--linea);border-bottom:1px solid var(--linea);transform:translateX(-50%) rotate(45deg)}
.pop.abajo::after{bottom:auto;top:-6px;transform:translateX(-50%) rotate(225deg)}
.pop-cab{display:flex;gap:10px;align-items:center;padding:12px 12px 8px}
.pop-cab .retrato{width:40px;height:40px;border-radius:10px;background:var(--fondo);image-rendering:pixelated;flex:none}
.pop-cab b{font-size:14px;display:block;line-height:1.2}
.pop-cab small{color:var(--suave);font-size:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pop-x{margin-left:auto;align-self:flex-start;width:26px;height:26px;border:0;background:none;border-radius:6px;color:var(--suave);cursor:pointer;display:flex;align-items:center;justify-content:center}
.pop-x:hover{background:var(--panel-2)}
.pop-x svg{width:14px;height:14px}
.estado{margin:0 12px;padding:9px 10px;border-radius:9px;background:var(--panel-2);border:1px solid var(--linea);display:flex;flex-direction:column;gap:4px}
.estado-l{display:flex;align-items:center;gap:7px;font-weight:600;font-size:12.5px}
.estado-l i{width:8px;height:8px;border-radius:50%;flex:none}
.estado-l i.vivo{animation:latido 1.4s ease-in-out infinite}
@keyframes latido{50%{opacity:.35}}
.estado p{color:var(--suave);font-size:12.5px}
.estado .barra{height:4px;border-radius:2px;background:var(--linea);overflow:hidden;margin-top:3px}
.estado .barra span{display:block;height:100%;background:var(--ok)}
.estado.err{background:color-mix(in srgb,var(--peligro) 8%,var(--panel));border-color:color-mix(in srgb,var(--peligro) 30%,var(--linea))}
.estado.err .estado-l{color:var(--peligro)}
.estado .acciones{justify-content:flex-start;margin-top:4px}
.pop-filas{padding:8px 12px 2px;display:flex;flex-direction:column;gap:2px}
.pop-fila{display:flex;gap:8px;align-items:flex-start;padding:5px 6px;margin:0 -6px;border-radius:7px;font-size:12.5px;color:var(--suave);background:none;border:0;text-align:left;cursor:pointer;width:calc(100% + 12px)}
.pop-fila:hover{background:var(--panel-2)}
.pop-fila svg{width:14px;height:14px;margin-top:2px;color:var(--tenue)}
.pop-fila span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pop-fila b{color:var(--texto);font-weight:550}
.pop-fila em{font-style:normal;color:var(--tenue);font-size:11.5px;white-space:nowrap}
.pop-sec{display:flex;align-items:center;justify-content:space-between;margin:2px 0 2px;font-size:11px;font-weight:600;color:var(--tenue);text-transform:uppercase;letter-spacing:.04em}
.pop-sec .btn{text-transform:none;letter-spacing:0;font-weight:500;height:22px;padding:0 7px}
.pop-sec .btn svg{width:13px;height:13px}
.charla-fila span{display:flex;flex-direction:column;-webkit-line-clamp:unset}
.charla-fila span b,.charla-fila span small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.charla-fila small{font-size:12px;color:var(--suave)}
.vivo-p{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;margin:5px 3px 0;animation:latido 1.4s ease-in-out infinite}
.vivo-p.esp{background:var(--peligro)}
.sel-charla{display:inline-flex;align-items:center;gap:3px;border:0;background:none;padding:2px 6px;margin:1px 0 0 -6px;border-radius:6px;font-size:12px;color:var(--suave);cursor:pointer;max-width:240px}
.sel-charla:hover{background:var(--panel-2);color:var(--texto)}
.sel-charla svg{width:13px;height:13px}
.menu-charlas{position:absolute;top:100%;left:-6px;margin-top:4px;z-index:2;width:280px;background:var(--panel);border:1px solid var(--linea);border-radius:10px;box-shadow:var(--sombra-alta);padding:4px;display:flex;flex-direction:column}
.menu-charlas[hidden]{display:none}
.menu-charlas button{display:flex;align-items:flex-start;gap:8px;border:0;background:none;padding:7px 8px;border-radius:7px;text-align:left;cursor:pointer}
.menu-charlas button:hover,.menu-charlas button.act{background:var(--panel-2)}
.menu-charlas button svg{width:14px;height:14px;margin-top:2px;color:var(--tenue)}
.menu-charlas span{display:flex;flex-direction:column;min-width:0}
.menu-charlas b{font-weight:550;font-size:12.5px}
.menu-charlas small{color:var(--tenue);font-size:11.5px}
.rapido{display:flex;gap:6px;padding:8px 12px 0}
.rapido .campo{height:30px;font-size:12.5px}
.rapido .btn{width:30px;height:30px;padding:0;flex:none}
.pop-acc{display:flex;gap:6px;padding:10px 12px 12px}
.pop-acc{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--linea);margin-top:10px;padding-top:10px!important}
.pop-acc .btn{flex:1;padding:0 6px}
.pop-acc .btn.pri{flex:1.4}
/* chat en panel lateral: la oficina sigue a la vista */
.cajon{position:absolute;top:0;right:0;bottom:0;width:min(420px,100%);z-index:9;background:var(--panel);border-left:1px solid var(--linea);box-shadow:var(--sombra-alta);display:flex;flex-direction:column;
  transform:translateX(102%);transition:transform .2s ease}
.cajon.abierto{transform:none}
.cajon .der-cab{padding:12px 12px 10px;border-bottom:1px solid var(--linea);position:relative;z-index:3;background:var(--panel)}
.cajon .der-cab .retrato{width:40px;height:40px;border-radius:10px;background:var(--fondo);image-rendering:pixelated;flex:none;cursor:pointer}
.cajon .der-cab .der-acciones{flex-wrap:nowrap;gap:2px}
.cajon .der-cuerpo{padding:14px}
.cajon .der-pie{display:flex;gap:6px;padding:10px 12px 12px}
.ico-b{width:30px;height:30px;border:0;background:none;border-radius:7px;color:var(--suave);cursor:pointer;display:flex;align-items:center;justify-content:center}
.ico-b:hover{background:var(--panel-2);color:var(--texto)}
.ico-b svg{width:16px;height:16px}
/* con el cajón abierto, la oficina corre a la izquierda para que no tape a la persona */
.app.con-cajon .herr{right:434px}
/* control del boceto */
.boceto{position:absolute;right:14px;bottom:10px;z-index:7;background:var(--panel);border:1px dashed var(--linea-fuerte);border-radius:var(--radio);padding:8px 10px;font-size:12px;box-shadow:var(--sombra);display:flex;flex-direction:column;gap:6px;max-width:260px}
.boceto b{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--tenue)}
.boceto .fila{gap:4px}
.app.con-cajon .boceto{display:none}
.app.en-seccion .pop,.app.en-seccion .cajon,.app.en-seccion .boceto{display:none}
/* celular: la tarjeta es una hoja que sube desde abajo */
@media (max-width:700px){
  .pop,.pop.abajo{left:8px!important;right:8px;top:auto!important;bottom:8px;width:auto;transform:none}
  .pop::after{display:none}
  .boceto{display:none}
}
.app,.app.en-oficina{grid-template-columns:var(--riel) minmax(0,1fr);position:relative}
.vista{grid-column:2}
.lista-col,.app.en-oficina .lista-col{display:none;position:absolute;z-index:10;left:calc(var(--riel) + 12px);top:12px;bottom:12px;width:min(284px,calc(100% - var(--riel) - 24px));
  border:1px solid var(--linea);border-radius:12px;box-shadow:var(--sombra-alta);background:var(--panel-2)}
.app.con-lista .lista-col{display:flex}
.lista-cab .lista-x{margin-left:4px;width:26px;height:26px}
.lista-cab>*:nth-child(2):not(.lista-x){margin-left:auto}
.lista-cab .lista-x:first-of-type{margin-left:auto}
.app.en-oficina .panel{display:none}
.app.con-panel .panel{display:flex;position:absolute;z-index:9;top:12px;right:12px;bottom:12px;width:min(440px,calc(100% - 24px));border:1px solid var(--linea);border-radius:12px;box-shadow:var(--sombra-alta);overflow:hidden;animation:entra .18s ease}
.app.con-panel.panel-ancho .panel{width:min(640px,calc(100% - 24px))}
.app.con-panel.completa .panel{top:0;right:0;bottom:0;left:0;width:auto;border-radius:0;border:0;box-shadow:none;animation:none}
.app.con-panel.completa.con-lista .panel{left:308px;border-left:1px solid var(--linea)}
.app.completa .lista-col{box-shadow:none}
@keyframes entra{from{opacity:0;transform:translateX(16px)}}
.panel-barra{display:flex;align-items:center;gap:2px;padding:8px 8px 0 16px;flex:none}
.miga{flex:1;min-width:0;font-size:12px;color:var(--tenue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.miga i{font-style:normal;margin:0 6px}
.miga b{color:var(--suave);font-weight:550}
.cajon{top:12px;right:12px;bottom:12px;width:min(420px,calc(100% - 24px));border:1px solid var(--linea);border-radius:12px;transform:translateX(110%)}
.cajon .der-cab{border-radius:12px 12px 0 0}
.app.con-lista .rotulo,.app.con-lista .zonas,.app.con-lista .pista{display:none}
.app.con-panel .herr,.app.con-cajon .herr{display:none}
.app.en-seccion #stage{display:block}
@media (max-width:700px){
  .lista-col,.app.en-oficina .lista-col{left:8px;right:8px;top:auto;bottom:calc(64px + 8px);width:auto;max-height:45%}
  .app.con-panel .lista-col{display:none}
  .app.con-panel .panel,.cajon{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:72%}
}
.app.lista-plegada .lista-col{display:none}
.app.lista-plegada.lista-ver .lista-col{display:flex;z-index:11}
.miga-sec{border:0;background:none;padding:2px 5px;margin-left:-5px;border-radius:5px;color:inherit;font:inherit;cursor:pointer}
.miga-sec:hover{background:var(--panel-2);color:var(--texto)}
.app:not(.lista-plegada) .miga-sec{pointer-events:none}
/* ---------- columnas pegadas al riel ---------- */
.lista-col,.app.en-oficina .lista-col{left:0;top:0;bottom:0;width:284px;border:0;border-right:1px solid var(--linea);border-radius:0;box-shadow:none;background:var(--panel-2)}
.app.con-panel .panel{top:0;bottom:0;right:auto;left:284px;width:440px;border:0;border-right:1px solid var(--linea);border-radius:0;box-shadow:10px 0 28px rgba(20,18,15,.10);animation:entra .16s ease;background:var(--panel)}
.app.con-panel.panel-ancho .panel{width:640px}
.app.lista-plegada .panel{left:0}
.app.lista-plegada.lista-ver .lista-col{box-shadow:var(--sombra-alta)}
.app.con-panel.completa .panel{left:284px;right:0;width:auto;box-shadow:none}
.app.con-panel.completa.lista-plegada .panel{left:0}
.app.con-panel.completa.con-lista .panel{border-left:0}
@keyframes entra{from{opacity:0;transform:translateX(-12px)}}
.cajon,.pop{display:none!important}
/* contactos */
.cara{position:relative;flex:none;display:block}
.cara i{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;border:2px solid var(--panel-2)}
.cara.grande .retrato{width:40px;height:40px;border-radius:10px}
.cara.grande i{border-color:var(--panel);width:12px;height:12px}
.contacto .lista-item-tit{align-items:center}
.globo{flex:none;font-size:10.5px;font-weight:600;color:#fff;background:var(--peligro);border-radius:8px;padding:1px 6px}
.lista-grupo svg{width:13px;height:13px}
.caras{display:flex;flex:none}
.caras .mini{width:22px;height:22px;border-radius:6px;border:2px solid var(--panel-2);margin-left:-8px;background:var(--fondo)}
.caras .mini:first-child{margin-left:0}
.reu .caras{width:46px}
.lista-item .vivo-p{margin:0 0 0 4px}

.det-herr{display:flex;gap:0;margin-left:auto;flex:none}
.miga-txt{flex:1;font-size:12px;color:var(--suave);font-weight:550}
.miga-sec{display:none;align-items:center;gap:5px;font-size:12px;color:var(--suave)}
.miga-sec svg{width:15px;height:15px}
.app.lista-plegada .miga-sec{display:inline-flex;pointer-events:auto}
.det-pest{padding:0 14px;flex:none}

.det-charla .sel-charla{margin:0 0 0 -6px;font-size:12.5px;color:var(--texto);font-weight:550}
.det-charla .menu-charlas{left:8px;top:100%}
.panel .der-cuerpo>.lectura{display:flex;flex-direction:column;gap:10px}
.compo{display:flex;gap:6px;align-items:center}
.app.con-lista .herr{display:flex}
html,body{margin:0}
.lista-cab .lista-x{order:3;margin-left:0}
.lista-cab .ico-b:not(.lista-x){margin-left:auto}

.app.con-panel.panel-ancho .panel{width:auto}
.col-det{width:440px;display:flex;flex-direction:column;min-width:0;min-height:0}
.app.panel-ancho .col-det{width:640px}
.app.completa .col-det{flex:1;width:auto}

.col-lat.ficha{width:400px;background:var(--panel)}

.lat-cab b{flex:1;font-size:13px}
.lat-pest{flex:1;border:0;padding:0;margin-bottom:-8px}
.lat-cuerpo{flex:1;overflow-y:auto;padding:0 10px 14px}
.lat-sec{border-top:1px solid var(--linea);padding:6px 0}

.col-lat .der-cuerpo{padding:12px 14px}

<script>/* v2/nucleo.js, copiado acá para que el boceto abra sin servidor */
/* Núcleo de dibujo pixel de la oficina. Todo se pinta con fillRect, sin antialias.
   Mundo isométrico: x crece hacia abajo-derecha, y hacia abajo-izquierda.
   Una baldosa mide 24·S × 12·S px. Las alturas (z, h) van en "unidades" que se multiplican por S. */
(function (root) {
  const N = {};
  N.S = 2.5; N.OX = 0; N.OY = 0; N.g = null;
  const R = N.R = Math.round;
  N.iso = (x, y) => [N.OX + (x - y) * 12 * N.S, N.OY + (x + y) * 6 * N.S];
  N.up = (p, h) => [p[0], p[1] - h * N.S];
  N.rect = (x, y, w, h, c) => { N.g.fillStyle = c; N.g.fillRect(R(x), R(y), w, h); };
  N.px = (x, y, c) => { N.g.fillStyle = c; N.g.fillRect(R(x), R(y), 1, 1); };
  N.poly = (pts, c) => {
    const g = N.g; g.fillStyle = c; let a = Infinity, b = -Infinity;
    for (const p of pts) { a = Math.min(a, p[1]); b = Math.max(b, p[1]); }
    for (let y = Math.floor(a); y < Math.ceil(b); y++) {
      const yc = y + .5, xs = [];
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i], q = pts[(i + 1) % pts.length];
        if ((p[1] <= yc && q[1] > yc) || (q[1] <= yc && p[1] > yc)) xs.push(p[0] + (yc - p[1]) * (q[0] - p[0]) / (q[1] - p[1]));
      }
      xs.sort((m, n) => m - n);
      for (let i = 0; i + 1 < xs.length; i += 2) { const x0 = R(xs[i]), x1 = R(xs[i + 1]); if (x1 > x0) g.fillRect(x0, y, x1 - x0, 1); }
    }
  };
  N.line = (x0, y0, x1, y1, c) => {
    x0 = R(x0); y0 = R(y0); x1 = R(x1); y1 = R(y1); N.g.fillStyle = c;
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy;
    for (let n = 0; n < 2000; n++) { N.g.fillRect(x0, y0, 1, 1); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
  };
  N.L = (p, q, c) => N.line(p[0], p[1], q[0], q[1], c);
  /* rombo de piso entre (x0,y0) y (x1,y1), a altura z */
  N.quad = (x0, y0, x1, y1, c, z = 0) => N.poly([N.up(N.iso(x0, y0), z), N.up(N.iso(x1, y0), z), N.up(N.iso(x1, y1), z), N.up(N.iso(x0, y1), z)], c);
  /* caja: planta (x,y,w,d) en baldosas, base z y alto h en unidades.
     c = {t: tapa, l: cara de adelante-izquierda (y+d, la más clara), r: cara de adelante-derecha (x+w, la oscura), o: contorno opcional, hi: brillo del borde de la tapa opcional} */
  N.box = (x, y, w, d, z, h, c) => {
    const { iso, up, poly, L } = N, a = iso(x, y), b = iso(x + w, y), C = iso(x + w, y + d), D = iso(x, y + d);
    const T = [up(a, z + h), up(b, z + h), up(C, z + h), up(D, z + h)];
    poly([up(D, z), up(C, z), T[2], T[3]], c.l); poly([up(C, z), up(b, z), T[1], T[2]], c.r); poly(T, c.t);
    if (c.o) { L(T[0], T[1], c.o); L(T[0], T[3], c.o); L(T[1], up(b, z), c.o); L(T[3], up(D, z), c.o); L(up(D, z), up(C, z), c.o); L(up(C, z), up(b, z), c.o); L(T[2], up(C, z), c.o); }
    if (c.hi) { L(T[3], T[2], c.hi); L(T[2], T[1], c.hi); }
    return { a, b, C, D, T };
  };
  /* cara vertical plana sobre una pared o costado: a lo largo de x (en y fija) o de y (en x fija) */
  N.panelX = (x0, x1, y, z0, z1, c) => N.poly([N.up(N.iso(x0, y), z0), N.up(N.iso(x1, y), z0), N.up(N.iso(x1, y), z1), N.up(N.iso(x0, y), z1)], c);
  N.panelY = (y0, y1, x, z0, z1, c) => N.poly([N.up(N.iso(x, y0), z0), N.up(N.iso(x, y1), z0), N.up(N.iso(x, y1), z1), N.up(N.iso(x, y0), z1)], c);
  N.disc = (cx, cy, r, c) => { N.g.fillStyle = c; for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r + r * .8) N.g.fillRect(R(cx) + x, R(cy) + y, 1, 1); };
  /* elipse achatada (plato, maceta vista de arriba) */
  N.ellipse = (cx, cy, rx, ry, c) => { N.g.fillStyle = c; for (let y = -ry; y <= ry; y++) { const w = R(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry + .01)))); N.g.fillRect(R(cx) - w, R(cy) + y, w * 2 + 1, 1); } };
  N.dith = (cx, cy, rx, ry, c, al) => {
    const g = N.g, a0 = g.globalAlpha; g.globalAlpha = al; g.fillStyle = c; cx = R(cx); cy = R(cy);
    for (let y = -ry; y <= ry; y++) for (let x = -rx; x <= rx; x++) { const d = (x * x) / (rx * rx) + (y * y) / (ry * ry); if (d <= 1 && (d < .72 || ((x + y) & 1) === 0)) g.fillRect(cx + x, cy + y, 1, 1); }
    g.globalAlpha = a0;
  };
  N.alpha = (a, fn) => { const a0 = N.g.globalAlpha; N.g.globalAlpha = a; fn(); N.g.globalAlpha = a0; };
  N.shade = (h, k) => {
    const n = parseInt(h.slice(1, 7), 16); const r = n >> 16, gg = n >> 8 & 255, b = n & 255;
    const f = v => Math.max(0, Math.min(255, Math.round(k < 1 ? v * k : v + (255 - v) * (k - 1))));
    return '#' + [f(r), f(gg), f(b)].map(v => v.toString(16).padStart(2, '0')).join('');
  };
  /* tres tonos de un color para cajas: tapa clara, frente medio, costado oscuro */
  N.tonos = (h, o) => ({ t: N.shade(h, 1.12), l: h, r: N.shade(h, .78), o });
  N.rng = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  N.OUT = '#2a1f2e';
  root.N = N;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* v2/muebles.js, copiado acá para que el boceto abra sin servidor */
/* Muebles y objetos de la oficina pixel (v2). Se apoya en el núcleo N (nucleo.js).
   Todo se pinta con fillRect (a través de N): nada de caminos, arcos, degradés ni imágenes.
   Convención: M.nombre(x, y, o) con (x, y) = esquina mínima de la huella en el mundo.
   Los objetos con frente aceptan o.mira ∈ '+x' | '+y' | '-x' | '-y' (hacia dónde mira el frente).
   M.huella.nombre = {w, d} en baldosas, sin rotar (con mira ±x se intercambian w y d). */
(function (root) {
  const N = root.N;
  const M = {}; M.huella = {}; M.pared = {};
  const O = N.OUT, sh = (c, k) => N.shade(c, k), R = Math.round;

  /* ---------- materiales: tapa, frente (claro), costado (oscuro), contorno, brillo ---------- */
  const T = (t, l, r, o, hi) => ({ t, l, r, o, hi });
  const tono = (c, o = O, hi) => ({ t: sh(c, 1.16), l: c, r: sh(c, .76), o, hi: hi === undefined ? sh(c, 1.32) : hi });
  const MAT = {
    madera: T('#e3b57c', '#c48d55', '#a06d3d', O, '#f3d3a2'),
    maderaOsc: T('#a26a43', '#7e4f2f', '#653d23', O, '#c08a5e'),
    blanco: T('#f7f5f0', '#dcd7ce', '#c0b9ae', O, '#ffffff'),
    metal: T('#5d5f6b', '#44464f', '#35363e'),
    metalO: T('#5d5f6b', '#44464f', '#35363e', O),
    cromo: T('#d5dae1', '#aeb5bf', '#8f97a3'),
    gris: T('#d3d8df', '#b0b7c1', '#939ba7', O, '#eef1f5'),
    negro: T('#3a3c46', '#25262e', '#1c1d23', O),
    piedra: T('#eeeae3', '#cfc9bf', '#b3ada3', O, '#ffffff'),
  };
  const LIBROS = ['#e2574c', '#4a80c6', '#f2b84b', '#4fb176', '#9c88c0', '#efe9dc', '#e58a3a', '#3f5f8a', '#c0504d', '#6aa0a8', '#d7c3a0'];
  const HOJAS = ['#24603a', '#2f7d45', '#46a457', '#7fd06e'];

  /* ---------- kit de armado en coordenadas locales ----------
     u = ancho (W), v = profundidad (D); el frente está en v = D. mira rota el kit en el mundo.
     Cada pieza es una caja con huella en el mundo; al final se ordenan atrás→adelante. */
  function K(x, y, mira, W, D) {
    const m = mira || '+y';
    const toW = (u, v) => m === '-y' ? [x + W - u, y + D - v] : m === '+x' ? [x + v, y + W - u] : m === '-x' ? [x + D - v, y + u] : [x + u, y + v];
    const P = (u, v, z) => N.up(N.iso(...toW(u, v)), z || 0);
    const NR = { front: [0, 1], back: [0, -1], left: [-1, 0], right: [1, 0] };
    const wn = s => { const [a, b] = NR[s]; return m === '-y' ? [-a, -b] : m === '+x' ? [b, -a] : m === '-x' ? [-b, a] : [a, b]; };
    const wb = (u, v, w, d) => { const p = toW(u, v), q = toW(u + w, v + d); return [Math.min(p[0], q[0]), Math.min(p[1], q[1]), Math.abs(q[0] - p[0]), Math.abs(q[1] - p[1])]; };
    const parts = [];
    const k = { P, toW, m, W, D };
    k.vis = s => { const [a, b] = wn(s); return a > 0 || b > 0; };
    /* color de una cara a mano según hacia dónde mira en el mundo */
    k.lado = (s, mat) => wn(s)[1] > 0 ? mat.l : mat.r;
    k.box = (u, v, w, d, z, h, c, after) => { const b = wb(u, v, w, d); parts.push({ b, z, h, f: () => { N.box(b[0], b[1], b[2], b[3], z, h, c); if (after) after(); } }); return k; };
    k.fn = (u, v, w, d, z, h, f) => { parts.push({ b: wb(u, v, w, d), z, h, f }); return k; };
    k.fv = (u0, u1, v, z0, z1, c) => N.poly([P(u0, v, z0), P(u1, v, z0), P(u1, v, z1), P(u0, v, z1)], c);
    k.fu = (v0, v1, u, z0, z1, c) => N.poly([P(u, v0, z0), P(u, v1, z0), P(u, v1, z1), P(u, v0, z1)], c);
    k.top = (u0, v0, u1, v1, z, c) => N.poly([P(u0, v0, z), P(u1, v0, z), P(u1, v1, z), P(u0, v1, z)], c);
    k.ln = (a, b, c) => N.L(P(a[0], a[1], a[2]), P(b[0], b[1], b[2]), c);
    /* parámetro de una cara vertical: s 0..1 de izquierda a derecha en pantalla, t 0..1 de arriba a abajo */
    k.cara = (side, a0, a1, plane, z0, z1) => {
      const pt = (a, z) => (side === 'front' || side === 'back') ? P(a, plane, z) : P(plane, a, z);
      const flip = pt(a1, z0)[0] < pt(a0, z0)[0];
      return (s, t) => pt(flip ? a1 - (a1 - a0) * s : a0 + (a1 - a0) * s, z1 - (z1 - z0) * t);
    };
    /* la cara del frente si se ve; si no, la de atrás (para dibujar el lado que corresponde) */
    k.frenteVisible = () => k.vis('front');
    k.sombra = (u, v, w, d, a) => { const b = wb(u, v, w, d); sombra(b[0], b[1], b[2], b[3], a); };
    k.draw = () => {
      const n = parts.length, e = 1e-6;
      const bef = (A, B) => {
        const a = A.b, b = B.b;
        if (a[0] + a[2] <= b[0] + e || a[1] + a[3] <= b[1] + e) return true;
        const ov = a[0] < b[0] + b[2] - e && b[0] < a[0] + a[2] - e && a[1] < b[1] + b[3] - e && b[1] < a[1] + a[3] - e;
        return ov && A.z + A.h <= B.z + e;
      };
      const indeg = new Array(n).fill(0), adj = parts.map(() => []), used = new Array(n).fill(false);
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (i !== j && bef(parts[i], parts[j]) && !bef(parts[j], parts[i])) { adj[i].push(j); indeg[j]++; }
      for (let c = 0; c < n; c++) {
        let p = -1;
        for (let i = 0; i < n; i++) if (!used[i] && indeg[i] === 0) { p = i; break; }
        if (p < 0) for (let i = 0; i < n; i++) if (!used[i]) { p = i; break; }
        used[p] = true; adj[p].forEach(j => indeg[j]--); parts[p].f();
      }
    };
    return k;
  }

  /* helpers sobre una cara parametrizada S(s,t) */
  const qS = (S, s0, s1, t0, t1, c) => N.poly([S(s0, t0), S(s1, t0), S(s1, t1), S(s0, t1)], c);
  const lS = (S, s0, t0, s1, t1, c) => N.L(S(s0, t0), S(s1, t1), c);
  const pS = (S, s, t, c) => { const p = S(s, t); N.px(p[0], p[1], c); };

  /* sombra de contacto sobre el piso, corrida hacia abajo-derecha (luz de arriba a la izquierda) */
  function sombra(x, y, w, d, a) {
    N.alpha(a || .13, () => N.quad(x + .03, y + .01, x + w + .07, y + d + .05, O));
  }

  /* cilindro (macetas, puffs, tachos, mesas redondas): centro en el mundo, radio en baldosas */
  function cyl(cx, cy, r, z0, h, c, o = O) {
    const C = N.iso(cx, cy), rx = Math.max(1, R(r * 42.4)), ry = Math.max(1, R(r * 21.2));
    const X = R(C[0]), yb = R(C[1] - z0 * N.S), yt = R(C[1] - (z0 + h) * N.S);
    const ee = i => R(ry * Math.sqrt(Math.max(0, 1 - (i * i) / ((rx + .5) * (rx + .5)))));
    const hl = c.hl || sh(c.l, 1.18);
    for (let i = -rx; i <= rx; i++) {
      const e = ee(i), col = i === R(-rx * .55) ? hl : i <= R(rx * .2) ? c.l : c.r;
      N.rect(X + i, yt + e, 1, yb - yt + 1, col);
      if (o) N.px(X + i, yb + e + 1, o);
    }
    for (let i = -rx; i <= rx; i++) { const e = ee(i); N.rect(X + i, yt - e, 1, 2 * e + 1, c.t); if (o) N.px(X + i, yt - e - 1, o); }
    if (o) { N.rect(X - rx - 1, yt, 1, yb - yt + 1, o); N.rect(X + rx + 1, yt, 1, yb - yt + 1, o); }
    return { X, yt, yb, rx, ry, ee };
  }
  /* disco plano (base de lámpara, tapa de mesa alta) */
  const disco = (cx, cy, r, z, col, o) => cyl(cx, cy, r, z, 0, { t: col, l: col, r: col, hl: col }, o);

  /* hoja de planta: tallo que sale de (x0,y0) con ángulo desde la vertical (rad), largo en px y caída */
  function hoja(x0, y0, ang, len, caida, ancho, tonos) {
    const n = Math.max(4, R(len * 1.2)), pts = [];
    for (let i = 0; i <= n; i++) {
      const s = i / n;
      const w = Math.max(1, R(ancho * Math.pow(Math.sin(Math.PI * Math.min(.98, s * .9 + .08)), .7)));
      pts.push([x0 + Math.sin(ang) * len * s, y0 - Math.cos(ang) * len * s + caida * len * s * s, w]);
    }
    for (const [x, y, w] of pts) N.rect(x - w / 2 - 1, y - 1, w + 2, 3, O);
    for (const [x, y, w] of pts) N.rect(x - w / 2, y, w, 1, tonos[1]);
    for (const [x, y, w] of pts) if (w > 1) N.rect(x - w / 2, y, Math.max(1, w - 1), 1, tonos[2]);
    for (let i = 1; i < pts.length - 1; i++) if (i % 2 === 0) { const [x, y, w] = pts[i]; if (w > 2) N.px(x - w / 2, y, tonos[3]); }
  }

  /* contenido de pantalla según el estado del agente; S(s,t) es la cara de la pantalla */
  const EST = {
    trabajando: { bg: '#a6f0bf', fg: '#2b7a49', led: '#5ccf7e' },
    pensando: { bg: '#f9dd8f', fg: '#a0700f', led: '#f2c14e' },
    herramienta: { bg: '#a9cdf7', fg: '#2f63b8', led: '#5a9cf0' },
    error: { bg: '#f59a92', fg: '#ffffff', led: '#f0564c' },
    inactivo: { bg: '#1b1d27', fg: '#5a6080', led: '#3a3d4a' },
  };
  function pantalla(S, estado, t, seed, luz) {
    const e = EST[estado] || EST.inactivo; t = t || 0; seed = seed || 0;
    let bg = e.bg;
    if (estado === 'error' && (t >> 1) % 2) bg = '#e8746b';
    qS(S, 0, 1, 0, 1, bg);
    if (estado === 'trabajando') {
      for (let i = 0; i < 4; i++) {
        const ind = ((seed + i * 3) % 3) * .1, full = .45 + ((seed * 7 + i * 5) % 5) * .08;
        const len = i === 3 ? full * (((t + seed) % 8) / 8) : full;
        if (len > .02) lS(S, .1 + ind, .18 + i * .2, .1 + ind + len * .8, .18 + i * .2, e.fg);
      }
      if (t % 2 === 0) { const p = S(.1 + (((t + seed) % 8) / 8) * .45, .78); N.px(p[0] + 1, p[1], e.fg); }
    } else if (estado === 'pensando') {

  const E = .03;

   ${bloqueEstado(a)}

     <div class="pop-sec"><span>Charlas con ${a.n}</span><button class="btn chico" data-acc="nueva" title="Empezar una charla nueva con ${a.n}">${ic('mas')}Nueva</button></div>
     ${charlasDe(a).slice(0,3).map((c,i)=>`<button class="pop-fila charla-fila" data-acc="charla" data-i="${i}" title="Abrir esta charla">${c.viva?`<i class="vivo-p${c.espera?' esp':''}" title="${c.espera?'Te está esperando':'Trabajando en esta charla'}"></i>`:ic('charla')}<span><b>${c.t}</b><small>${c.u}</small></span><em>${c.espera?'te espera':c.h}</em></button>`).join('')}

   </div>
   <form class="rapido" data-acc="rapido"><input class="campo" placeholder="Escribile a ${a.n}…" aria-label="Mensaje para ${a.n}"><button class="btn pri" title="Enviar y abrir la charla">${ic('enviar')}</button></form>
   <div class="pop-acc"><button class="btn chico pri" data-acc="charlar">${ic('charla')}Charlar</button><button class="btn chico" data-acc="tarea">${ic('reloj')}Tarea</button><button class="btn chico" data-acc="reunion">${ic('reunion')}Reunión</button><button class="btn chico" data-acc="ficha" title="Perfil, permisos, notas, tareas y archivos">${ic('lapiz')}Ficha</button></div></div>`;
  pintar(pop);pop.hidden=false;ubicar()}
function cerrarPop(){pop.hidden=true;elegido=null}

/* la tarjeta sigue al personaje mientras la cámara se acerca o él camina */
function ubicar(){if(pop.hidden||!elegido)return;const v=view.getBoundingClientRect(),m=vista.getBoundingClientRect(),p=O.aPantalla(elegido);
  const x=p.x+v.left-m.left,y=p.y+v.top-m.top,w=pop.offsetWidth,h=pop.offsetHeight,L=libre(),lim=m.width-L.der;
  const pieY=p.pie+v.top-m.top,arriba=y-20,debajo=m.height-pieY-20;
  const abajo=h>arriba&&debajo>arriba;pop.classList.toggle('abajo',abajo);
  pop.firstElementChild.style.maxHeight=Math.max(160,(abajo?debajo:arriba)-8)+'px';
  const cx=Math.max(L.izq+w/2+8,Math.min(lim-w/2-8,x));pop.style.left=cx+'px';pop.style.top=(abajo?p.pie+v.top-m.top:y)+'px';
  pop.style.setProperty('--flecha',Math.max(16,Math.min(w-16,w/2+(x-cx)))+'px')}
(function seguir(){ubicar();requestAnimationFrame(seguir)})();

function abrirCajon(a,texto,i){charlaI=i===undefined?0:i;const cs=charlasDe(a),c=cs[charlaI];

  pintar(cajon);cerrarPanel();cajon.classList.add('abierto');app.classList.add('con-cajon');plegar();enfocar(a);
  const cu=cajon.querySelector('.der-cuerpo');cu.scrollTop=cu.scrollHeight;setTimeout(()=>cajon.querySelector('.der-pie input').focus(),220)}
function cerrarCajon(){cajon.classList.remove('abierto');app.classList.remove('con-cajon');cajonDe=null;if(typeof plegar==='function')plegar()}

function accion(acc,a,e){
  if(acc==='cerrar')cerrarPop();
  else if(acc==='charlar')abrirCajon(a);
  else if(acc==='charla')abrirCajon(a,null,+e.target.closest('[data-i]').dataset.i);
  else if(acc==='nueva')abrirCajon(a,null,-1);
  else if(acc==='todas'){cerrarPop();cerrarCajon();ir('charlas',null)}
  else if(acc==='menu-charlas'){const m=cajon.querySelector('.menu-charlas');m.hidden=!m.hidden}
  else if(acc==='rapido'){e.preventDefault();const t=e.target.querySelector('input').value.trim();abrirCajon(a,t||null)}
  else if(acc==='enviar'){e.preventDefault();const i=e.target.querySelector('input'),t=i.value.trim();if(!t)return;
    cajon.querySelector('.der-cuerpo').insertAdjacentHTML('beforeend',`<div class="chat" style="margin-top:10px"><div class="msg yo">${t.replace(/</g,'&lt;')}</div></div>`);i.value=''}
  else if(acc==='ficha'){tab='perfil';ir('equipo',a.n)}
  else if(acc==='bandeja')ir('bandeja','revisar');
  else if(acc==='expandir')expandirCharla(a);
  else if(acc==='cerrar-cajon')cerrarCajon();
  else if(acc==='reunion'){cerrarPop();reunion()}
  else if(acc==='permitir'){a.s='work';abrirPop(a)}
  else if(acc==='tarea'||acc==='tareas-charla'){const b=e.target.closest('button');b.textContent='(en la app abre el editor de tareas)';setTimeout(()=>abrirPop(a),1200)}
}
pop.addEventListener('click',e=>{const b=e.target.closest('[data-acc]');if(b&&b.tagName!=='FORM'&&elegido)accion(b.dataset.acc,elegido,e)});
pop.addEventListener('submit',e=>{if(elegido)accion('rapido',elegido,e)});
cajon.addEventListener('click',e=>{const b=e.target.closest('[data-acc]');if(b&&b.tagName!=='FORM'&&cajonDe)accion(b.dataset.acc,cajonDe,e)});
cajon.addEventListener('submit',e=>{if(cajonDe)accion('enviar',cajonDe,e)});

function detPersona(a){const k=estadoDe(a),e=O.ST[k],cs=charlasDe(a);if(charlaI>=cs.length)charlaI=0;const c=cs[charlaI];
  const que=k==='tool'?O.TOOLTXT[a.tool]:k==='error'?'Pide permiso para la carpeta «Clientes»':e.a;
  const cuerpo=`${k==='error'&&charlaI===0?`<div class="estado err" style="margin:0 0 12px"><div class="estado-l"><i style="background:${e.c}"></i>Se trabó</div><p>Pide permiso para leer la carpeta «Clientes».</p><div class="acciones"><button class="btn chico pri" data-p="permitir">Permitir</button><button class="btn chico">Solo esta vez</button></div></div>`:''}
      ${charlaI===0?chat(a):c?`<div class="chat"><div class="msg yo">¿Te acordás de «${c.t.toLowerCase()}»?</div><div class="msg">${c.u}</div></div>`:`<div class="nav-vacio">${ic('charla')}<b>Charla nueva con ${a.n}</b>La anterior queda guardada. Contale qué necesitás.</div>`}`;
  return `<div class="det-cab">${miga()}<span class="cara grande">${cvTag(a.n)}<i style="background:${e.c}"></i></span>
     <div class="det-tit"><h2>${a.n}</h2><small>${e.l} · ${que}</small></div>
     <div class="det-herr"><button class="ico-b" data-p="ficha" aria-pressed="${lat==='ficha'}" title="Editar perfil, apariencia y permisos de ${a.n}">${ic('lapiz')}</button><button class="ico-b" data-p="ubicar" title="Ver dónde está ${a.n} en la oficina">${ic('pin')}</button>${herrDet()}</div></div>
   <div class="det-charla"><b class="charla-tit">${c?c.t:'Charla nueva'}</b><span class="meta">${c?c.h:''}</span></div>
   <div class="der-cuerpo"><div class="lectura">${cuerpo}</div></div>
   <form class="der-pie compo" data-p="enviar"><button type="button" class="ico-b" title="Adjuntar">${ic('clip')}</button><input class="campo" placeholder="Escribile a ${a.n}…" aria-label="Mensaje para ${a.n}"><button class="btn pri" style="width:34px;padding:0" title="Enviar">${ic('enviar')}</button></form>`}
function detReunion(r){
  return `<div class="det-cab">${miga()}<span class="caras">${r.q.map(n=>cvTag(n,'mini')).join('')}</span><div class="det-tit"><h2>${r.t}</h2><small>${r.viva?'En curso':'Terminó '+r.h} · ${r.q.join(', ')}</small></div>
     <div class="det-herr">${herrDet()}</div></div>
   <div class="der-cuerpo"><div class="lectura chat">
     <div class="msg yo">Arranquemos: ¿qué entra esta semana?</div>
     <div class="msg"><b>${r.q[0]}:</b> Propongo cerrar primero lo que está trabado y después lo nuevo.</div>
     <div class="msg"><b>${r.q[1]}:</b> De acuerdo. Yo me llevo la parte de ${TAREA[r.q[1]].toLowerCase()}.</div>
     ${r.viva?`<span class="herram">${ic('chispa')}${r.q[0]} está escribiendo…</span>`:`<div class="card"><h3>Resumen</h3><p>3 decisiones y 4 tareas repartidas.</p><div class="acciones"><button class="btn chico">Ver tareas</button></div></div>`}</div></div>
   ${r.viva?`<form class="der-pie compo" data-p="enviar"><input class="campo" placeholder="Escribir en la reunión…"><button class="btn pri" style="width:34px;padding:0">${ic('enviar')}</button></form>`:''}`}
function detGenerico(){return `<div class="det-cab simple">${miga()}<span class="miga-txt">${SUBT[sub]||sub}</span><div class="det-herr">${herrDet()}</div></div>`+VISTA[sec]()}

/* ---- ubicación de las columnas y la cámara ---- */
function libre(){const l=app.classList.contains('con-lista')&&lista.offsetWidth&&!app.classList.contains('lista-ver')?lista.offsetWidth:0;
  const d=app.classList.contains('con-panel')&&!app.classList.contains('completa')?panel.offsetWidth:0;return {izq:l+d,der:0}}
function enfocar(a){if(!a)return;requestAnimationFrame(()=>{const l=libre();O.setSel(a);O.enfocar(a,l.izq,0)})}
function plegar(){const d=app.classList.contains('con-panel');
  app.classList.toggle('lista-plegada',app.classList.contains('con-lista')&&d&&!app.classList.contains('completa')&&vista.clientWidth<284+anchoDet()+360);
  if(!app.classList.contains('lista-plegada'))app.classList.remove('lista-ver')}
const anchoDet=()=>(app.classList.contains('panel-ancho')?640:440)+(app.classList.contains('con-lat')?(lat==='ficha'?400:290):0);
function cerrarPanel(){app.classList.remove('con-panel','completa','panel-ancho','con-lat');plegar()}
function expandirCharla(a){ir('equipo',a.n)}
function pintarPanel(){const a=ag(sub),r=reu(sub);
  const lado=sec==='equipo'&&a&&lat?`<div class="col-lat ${lat}">${lat==='ficha'?colFicha(a):colInfo(a)}</div>`:'';
  panel.innerHTML=`<div class="col-det">${sec==='equipo'&&a?detPersona(a):sec==='equipo'&&r?detReunion(r):detGenerico()}</div>${lado}`;pintar(panel);
  app.classList.toggle('con-lat',!!lado);
  if(lat==='ficha'&&fichaTab==='perfil')prev();
  const cu=panel.querySelector('.col-det .der-cuerpo');if(cu&&a)cu.scrollTop=cu.scrollHeight}
/* el pin: cae sobre la cabeza de la persona, la sigue si camina, y se va solo */
const pinEl=document.createElement('div');pinEl.className='pin-mapa';pinEl.hidden=true;pinEl.innerHTML=`<svg viewBox="0 0 24 24" width="30" height="30"><path d="${P.pin}" fill="var(--peligro)" stroke="#fff" stroke-width="1.4"/><circle cx="12" cy="9.8" r="2.4" fill="#fff"/></svg>`;vista.appendChild(pinEl);
let pinDe=null,pinHasta=0;
function marcarPin(a){pinDe=a;pinHasta=performance.now()+2600;pinEl.hidden=false;pinEl.classList.remove('cae');void pinEl.offsetWidth;pinEl.classList.add('cae')}
(function seguirPin(){if(pinDe){if(performance.now()>pinHasta){pinEl.hidden=true;pinDe=null}else{const v=view.getBoundingClientRect(),m=vista.getBoundingClientRect(),p=O.aPantalla(pinDe);
  pinEl.style.left=(p.x+v.left-m.left)+'px';pinEl.style.top=(p.y+v.top-m.top)+'px'}}requestAnimationFrame(seguirPin)})();
function marcarRiel(s){document.querySelectorAll('.riel-item[data-sec]').forEach(b=>b.classList.toggle('activo',b.dataset.sec===s))}
function ir(s,x){
  if(s==='charlas')s='equipo';
  cerrarPop();cerrarCajon();menuAbierto=false;
  const otra=x!==sub||s!==sec;sec=s;sub=x===undefined?(ABRE_SOLO[s]?DEF[s]:null):x;
     // para el editor de apariencia de base (prev)
  app.classList.add('en-oficina');app.classList.remove('en-seccion','con-detalle','lista-ver');marcarRiel(s);
  if(s==='oficina'){cerrarPanel();app.classList.remove('con-lista');O.setSel(null);return}
  const lc=lista.querySelector('.lista-cuerpo'),y=lc&&s===lista.dataset.sec?lc.scrollTop:0;
  app.classList.add('con-lista');lista.innerHTML=LISTA[s]();lista.dataset.sec=s;pintar(lista);const lc2=lista.querySelector('.lista-cuerpo');if(lc2)lc2.scrollTop=y;
  if(!sub){cerrarPanel();return}
  app.classList.add('con-panel');app.classList.toggle('panel-ancho',!!ANCHO[s]);app.classList.toggle('con-lat',s==='equipo'&&!!ag(sub)&&!!lat);plegar();pintarPanel();
  const a=ag(sub),r=reu(sub);if(a)enfocar(a);else if(r)enfocar(ag(r.q[0]));
}
/* abrir el chat de alguien desde cualquier lado (lista, oficina, bandeja) */
function abrirPersona(n,t){eqTab='personas';if(n!==sub){latVista=null;latFiltro=''}if(t==='perfil'){lat='ficha';fichaTab='perfil'}charlaI=0;ir('equipo',n)}

/* ---- eventos ---- */
O.onPick=a=>abrirPersona(a.n);          // tocar a alguien en la oficina: su chat, en la misma columna
lista.addEventListener('click',e=>{
  if(e.target.closest('[data-cerrar-lista]')){ir('oficina');return}
  if(e.target.closest('[data-nueva-reu]')){reunion();return}
  const tb=e.target.closest('[data-eqtab]');if(tb){e.stopImmediatePropagation();eqTab=tb.dataset.eqtab;lista.innerHTML=LISTA.equipo();pintar(lista);return}
  const b=e.target.closest('[data-sub]');if(b&&ag(b.dataset.sub)){e.stopImmediatePropagation();abrirPersona(b.dataset.sub)}},true);
lista.addEventListener('mouseover',e=>{const b=e.target.closest('[data-sub]'),a=b&&ag(b.dataset.sub);if(a)O.setSel(a)});
lista.addEventListener('mouseleave',()=>O.setSel(ag(sub)||null));
panel.addEventListener('click',e=>{
  const f=e.target.closest('[data-f]');if(f){fichaTab=f.dataset.f;pintarPanel();return}
  const v=e.target.closest('[data-p=ver],[data-p=lat-volver]');if(v){latVista=v.dataset.p==='ver'?v.dataset.s:null;latFiltro='';pintarPanel();const q=panel.querySelector('[data-lat-q]');if(q)q.focus();return}
  const lp=e.target.closest('[data-p=ficha],[data-p=lat-cerrar]');if(lp){lat=lp.dataset.p==='ficha'&&lat!=='ficha'?'ficha':'info';app.classList.toggle('con-lat',!!lat);plegar();pintarPanel();enfocar(ag(sub));return}
  if(e.target.closest('[data-nueva-reu]')){reunion();return}
  const b=e.target.closest('[data-p]');if(!b||b.tagName==='FORM')return;const p=b.dataset.p,a=ag(sub);
  if(p==='lista'){app.classList.toggle('lista-ver');return}
  if(p==='cerrar'){sub=null;cerrarPanel();lista.innerHTML=LISTA[sec]();pintar(lista);return}
  if(p==='expandir'){app.classList.toggle('completa');plegar();pintarPanel();if(a)enfocar(a);return}
  if(p==='menu'){menuAbierto=!menuAbierto;panel.querySelector('.menu-charlas').hidden=!menuAbierto;return}
  if(p==='charla'){charlaI=+b.dataset.i;menuAbierto=false;latVista=null;latFiltro='';pintarPanel();return}
  if(p==='nueva'){charlaI=99;latVista=null;menuAbierto=false;pintarPanel();panel.querySelector('.col-det .compo input').focus();return}
  if(p==='permitir'&&a){a.s='work';pintarPanel();lista.innerHTML=LISTA.equipo();pintar(lista);return}
  if(p==='ubicar'&&a){enfocar(a);marcarPin(a);return}
  if(p==='sala'){enfocar(ag(reu(sub).q[0]));return}
});
panel.addEventListener('input',e=>{if(!e.target.matches('[data-lat-q]'))return;latFiltro=e.target.value;const tmp=document.createElement('div');tmp.innerHTML=colInfo(ag(sub));
  panel.querySelector('.col-lat .lat-cuerpo').replaceWith(tmp.querySelector('.lat-cuerpo'))});
panel.addEventListener('submit',e=>{e.preventDefault();const i=e.target.querySelector('input'),t=i.value.trim();if(!t)return;
  panel.querySelector('.col-det .der-cuerpo .lectura').insertAdjacentHTML('beforeend',`<div class="chat"><div class="msg yo">${t.replace(/</g,'&lt;')}</div></div>`);i.value='';
  const cu=panel.querySelector('.col-det .der-cuerpo');cu.scrollTop=cu.scrollHeight});
/* desde la ficha vieja o la bandeja, «Charlar» y la cara llevan al chat */
panel.addEventListener('click',e=>{const c=e.target.closest('[data-ir-charla],[data-ir-ficha]');if(!c)return;e.stopImmediatePropagation();
  abrirPersona(c.dataset.irCharla||c.dataset.irFicha,c.dataset.irFicha?'perfil':'charla')},true);
document.addEventListener('pointerdown',e=>{if(app.classList.contains('lista-ver')&&!e.target.closest('#lista,[data-p=lista]'))app.classList.remove('lista-ver');
  if(menuAbierto&&!e.target.closest('.menu-charlas,[data-p=menu]')){menuAbierto=false;const m=panel.querySelector('.menu-charlas');if(m)m.hidden=true}});
addEventListener('resize',()=>{plegar();setTimeout(()=>enfocar(ag(sub)),60)});
document.addEventListener('keydown',e=>{if(e.key!=='Escape'||!$('#v-paleta').hidden||!$('#v-ajustes').hidden)return;
  if(menuAbierto){menuAbierto=false;panel.querySelector('.menu-charlas').hidden=true;return}
  if(app.classList.contains('lista-ver')){app.classList.remove('lista-ver');return}
  if(app.classList.contains('completa')){app.classList.remove('completa');plegar();pintarPanel();return}
  if(lat==='ficha'&&app.classList.contains('con-lat')){lat='info';plegar();pintarPanel();return}
  if(app.classList.contains('con-panel')){sub=null;cerrarPanel();lista.innerHTML=LISTA[sec]();pintar(lista);return}
  if(app.classList.contains('con-lista'))ir('oficina')});
$('.pista').textContent='Rueda o pellizco para acercarte · arrastrá para moverte · tocá a alguien para abrir su chat · ⌘K buscar';

/* ---------- Nuevo, reunión, logo ---------- */
const mn=$('#m-nuevo');
mn.innerHTML=[['charla','Charlar con alguien…','ch'],['reunion','Llamar a reunión…','reu'],['personas','Contratar un agente…','con'],['chispa','Armar con el Creador…',''],['flujo','Nueva corrida de flujo…','flu'],['capas','Nuevo departamento…','dep']].map(([i,t,k])=>`<button data-k="${k}">${ic(i)}${t}</button>`).join('');
$('#b-nuevo').onclick=e=>{e.stopPropagation();const r=e.currentTarget.getBoundingClientRect();mn.style.left=Math.min(r.right+8,innerWidth-240)+'px';mn.style.top=r.top+'px';mn.hidden=!mn.hidden};
mn.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;mn.hidden=true;const k=b.dataset.k;
  if(k==='ch')ir('charlas','Ana');if(k==='reu')reunion();if(k==='con'){tab='perfil';ir('equipo','Ana')}if(k==='flu')ir('trabajo','flujos');if(k==='dep')ir('equipo','deptos')});
document.addEventListener('click',e=>{if(!mn.hidden&&!e.target.closest('#m-nuevo'))mn.hidden=true});
function reunion(){ir('oficina');O.go('M')}
$('#b-reu').onclick=reunion;
$('#b-aj').onclick=()=>ajustes();
$('#b-logo').onclick=()=>ir('oficina');

/* ---------- Ajustes ---------- */
let secAj='apariencia';
function ajustes(){const S=[['general','General'],['agentes','Agentes'],['permisos','Permisos de los agentes'],['conectores','Conectores'],['apariencia','Apariencia']];
  let c=secAj==='apariencia'?`<div><span class="etq">Estilo de la oficina</span><div class="temas"><button class="tema sel"><span class="pv" style="background:#5d7da6">Pixel</span><b>Pixel</b><span>Diorama 2.5D, el nuevo.</span></button><button class="tema"><span class="pv" style="background:#8a8378">3D clásico</span><b>3D clásico</b><span>Congelado: no recibe funciones nuevas.</span></button></div></div>
   <div class="toggle"><span><b>Luz según la hora</b><small>La oficina pasa por amanecer, mañana, mediodía, tarde, atardecer, anochecer y noche siguiendo tu reloj</small></span><button class="sw-on" role="switch" aria-checked="true" aria-label="Luz según la hora"></button></div></div>`
   :secAj==='permisos'?permisos():`<div class="card"><h3>${S.find(s=>s[0]===secAj)[1]}</h3><p>Sección de ejemplo del boceto.</p></div>`;
  $('#ajustes').innerHTML=`<div class="der-cab"><div class="der-ico">${ic('ajustes')}</div><div><h2>Ajustes</h2><small>Estudio · de Luis</small></div><button class="x" data-cerrar title="Cerrar">${ic('cerrar')}</button></div>
   <div class="ajustes"><nav>${S.map(([k,t])=>`<button aria-pressed="${k===secAj}" data-s="${k}">${t}</button>`).join('')}</nav><div class="der-cuerpo">${c}</div></div>`;$('#v-ajustes').hidden=false}
$('#v-ajustes').addEventListener('click',e=>{if(e.target.id==='v-ajustes'||e.target.closest('[data-cerrar]')){$('#v-ajustes').hidden=true;return}
  const s=e.target.closest('[data-s]');if(s){secAj=s.dataset.s;ajustes();return}
  const w=e.target.closest('.sw-on');if(w)w.setAttribute('aria-checked',w.getAttribute('aria-checked')!=='true');
  const t=e.target.closest('.tema');if(t)document.querySelectorAll('.tema').forEach(x=>x.classList.toggle('sel',x===t))});

/* ---------- ⌘K ---------- */
const vp=$('#v-paleta'),q=$('#q'),res=$('#res');
function lst(){const s=q.value.trim().toLowerCase(),m=x=>x.toLowerCase().includes(s);
  const A=O.AG.filter(a=>m(a.n)||m(ROL[a.n])).slice(0,6),X=[['Ir a la oficina','edificio','of'],['Llamar a reunión','reunion','reu'],['Contratar un agente','personas','con'],['Abrir Ajustes','ajustes','aj'],['Ver la bandeja','bandeja','ban']].filter(x=>m(x[0]));
  res.innerHTML=(A.length?'<div class="gr">Agentes</div>'+A.map(a=>`<button data-a="${a.n}">${cvTag(a.n,'mini')}${a.n}<small>${ROL[a.n]}</small></button>`).join(''):'')+(X.length?'<div class="gr">Acciones</div>'+X.map(([n,i,k])=>`<button data-x="${k}">${ic(i)}${n}</button>`).join(''):'')||'<div class="nav-vacio">Nada con ese nombre.</div>';
  pintar(res);const f=res.querySelector('button');if(f)f.classList.add('act')}
function paleta(on){vp.hidden=!on;if(on){q.value='';lst();q.focus()}}
$('#b-k').onclick=()=>paleta(true);
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();paleta(vp.hidden)}
  if(e.key==='Escape'){paleta(false);$('#v-ajustes').hidden=true;mn.hidden=true}if(!vp.hidden&&e.key==='Enter'){const b=res.querySelector('button.act');if(b)b.click()}});
q.addEventListener('input',lst);
vp.addEventListener('click',e=>{if(e.target===vp){paleta(false);return}const b=e.target.closest('button');if(!b)return;paleta(false);const k=b.dataset.x;
  if(b.dataset.a)ir('charlas',b.dataset.a);if(k==='of')ir('oficina');if(k==='reu')reunion();if(k==='con'){tab='perfil';ir('equipo','Ana')}if(k==='aj')ajustes();if(k==='ban')ir('bandeja')});

ir('oficina');
})();

</script>
