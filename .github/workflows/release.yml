# Build automático de los instaladores.
#
# - Al subir una etiqueta vX.Y.Z: corre los tests, arma el .dmg (Mac) y el instalador .exe (Windows) y los adjunta
#   a la release de esa etiqueta.
#   Si la release ya existe (notas escritas a mano), solo sube o reemplaza el instalador, sin tocar las notas.
#   Si no existe, la crea como borrador para completar las notas antes de publicarla.
# - A mano (Actions → Release → Run workflow): arma los instaladores y los deja como artefactos del run, sin release.
#
# Mac: la app Swift (app/). Windows: la carcasa Electron (desktop/) con el backend TypeScript.
#
# Actualizaciones automáticas: cada release lleva lo que leen las apps instaladas.
# - Mac (Sparkle): Oficina-X-arm64.zip firmado con la clave EdDSA (secret SPARKLE_PRIVATE_KEY) y appcast.xml.
# - Windows (electron-updater): latest.yml y el .blockmap junto al .exe.
# Las apps solo ven releases publicadas (no borradores): publicar la release es lo que la manda a todos.
# La versión sale siempre de app/Resources/Info.plist (el job de Windows se la pone a desktop/package.json).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    name: macOS (arm64)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Versión
        id: version
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' app/Resources/Info.plist)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con la versión de Info.plist ($VERSION)."
            exit 1
          fi

      # Compilaciones de Swift (debug de los tests y release de la app): con la caché solo se recompila lo que cambió.
      - name: Caché de la compilación de Swift
        uses: actions/cache@v4
        with:
          path: app/.build
          key: swift-${{ runner.os }}-${{ hashFiles('app/Package.swift', 'app/Package.resolved') }}-${{ hashFiles('app/Sources/**', 'app/Tests/**') }}
          restore-keys: |
            swift-${{ runner.os }}-${{ hashFiles('app/Package.swift', 'app/Package.resolved') }}-

      - name: Tests del backend
        run: app/Tests/run-tests.sh

      - name: Compilar y empaquetar
        run: app/make-dmg.sh --rebuild

      - name: Renombrar instalador
        id: dmg
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NAME="Oficina-$VERSION-arm64.dmg"
          mv "app/build/Oficina $VERSION.dmg" "app/build/$NAME"
          SHA="$(shasum -a 256 "app/build/$NAME" | cut -d' ' -f1)"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          {
            echo "### $NAME"
            echo
            echo "SHA-256: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Sparkle baja el .zip (no el .dmg) y lo verifica con la firma EdDSA que va en appcast.xml.
      - name: Paquete de actualización (Sparkle)
        id: sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::Falta el secret SPARKLE_PRIVATE_KEY: sin él la release no le llega a las Mac por actualización automática."
              exit 1
            fi
            echo "::warning::Sin SPARKLE_PRIVATE_KEY: no se arma el paquete de actualización."
            echo "listo=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' app/build/Oficina.app/Contents/Info.plist)"
          ZIP="Oficina-$VERSION-arm64.zip"
          (cd app/build && ditto -c -k --sequesterRsrc --keepParent Oficina.app "$ZIP")
          KEY="$RUNNER_TEMP/sparkle.key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY"
          FIRMA="$(app/.build/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file "$KEY" "app/build/$ZIP")"
          rm -f "$KEY"
          [ -n "$FIRMA" ] || { echo "::error::sign_update no devolvió la firma."; exit 1; }
          FECHA="$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')"
          cat > app/build/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Oficina</title>
              <item>
                <title>Oficina $VERSION</title>
                <pubDate>$FECHA</pubDate>
                <sparkle:version>$BUILD</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                <sparkle:fullReleaseNotesLink>https://github.com/$REPO/releases/tag/$TAG</sparkle:fullReleaseNotesLink>
                <enclosure url="https://github.com/$REPO/releases/download/$TAG/$ZIP" type="application/octet-stream" $FIRMA/>
              </item>
            </channel>
          </rss>
          EOF
          xmllint --noout app/build/appcast.xml
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "listo=1" >> "$GITHUB_OUTPUT"

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dmg.outputs.name }}
          path: |
            app/build/${{ steps.dmg.outputs.name }}
            app/build/Oficina-*-arm64.zip
            app/build/appcast.xml
          retention-days: 14

      - name: Adjuntar a la release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          FILE: app/build/${{ steps.dmg.outputs.name }}
          ZIP: app/build/${{ steps.sparkle.outputs.zip }}
          SHA: ${{ steps.dmg.outputs.sha }}
        run: |
          # el job de Windows corre en paralelo: si la otra ya creó la release, solo se sube el archivo
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "Oficina $VERSION" \
              --notes "Borrador generado por el build automático. Completar las notas antes de publicar." || true
          fi
          gh release upload "$TAG" "$FILE" "$ZIP" app/build/appcast.xml --clobber

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      # descargas de Electron y de las herramientas de electron-builder (NSIS, 7zip): van a la caché
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v4

      - name: Versión
        id: version
        run: |
          VERSION="$(grep -A1 'CFBundleShortVersionString' app/Resources/Info.plist | grep -o '<string>[^<]*</string>' | head -1 | sed 's/<[^>]*>//g')"
          [ -n "$VERSION" ] || { echo "::error::No pude leer la versión de Info.plist."; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con la versión de Info.plist ($VERSION)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            desktop/package-lock.json

      - name: Caché de Electron
        uses: actions/cache@v4
        with:
          path: .cache
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Dependencias
        run: |
          npm ci --prefix backend
          npm ci --prefix desktop

      - name: Tipos
        run: |
          (cd backend && npx tsc --noEmit)
          (cd desktop && npx tsc -p .)

      - name: Compilar y empaquetar
        working-directory: desktop
        run: |
          npm pkg set version="${{ steps.version.outputs.version }}"
          node scripts/build.mjs --recursos
          npx electron-builder --win --x64 --publish never

      - name: Instalador
        id: exe
        run: |
          NAME="Oficina-Setup-${{ steps.version.outputs.version }}.exe"
          for f in "$NAME" "$NAME.blockmap" latest.yml; do
            [ -f "desktop/release/$f" ] || { echo "::error::No se generó desktop/release/$f"; exit 1; }
          done
          SHA="$(sha256sum "desktop/release/$NAME" | cut -d' ' -f1)"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          { echo "### $NAME"; echo; echo "SHA-256: \`$SHA\`"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.exe.outputs.name }}
          path: |
            desktop/release/${{ steps.exe.outputs.name }}
            desktop/release/${{ steps.exe.outputs.name }}.blockmap
            desktop/release/latest.yml
          retention-days: 14

      - name: Adjuntar a la release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          FILE: desktop/release/${{ steps.exe.outputs.name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "Oficina $VERSION" \
              --notes "Borrador generado por el build automático. Completar las notas antes de publicar." || true
          fi
          # latest.yml y el .blockmap: los lee electron-updater en las apps instaladas
          gh release upload "$TAG" "$FILE" "$FILE.blockmap" desktop/release/latest.yml --clobber
